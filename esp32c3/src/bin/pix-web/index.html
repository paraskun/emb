<!DOCTYPE html><meta name=viewport content="width=device-width"><style>#g{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:400px}#g i{aspect-ratio:1;background:#000;outline:1px solid #555;cursor:pointer}#c{position:fixed;opacity:0}</style><div id=g></div><input type=color id=c><script>
let p,s=(e,v)=>{e.style.background=e.v=v;fetch('/set/'+e.n+'/'+[1,3,5].map(k=>parseInt(v.slice(k,k+2),16)).join('/'))};
for(let n=0;n<64;n++){let e=g.appendChild(document.createElement('i'));e.n=n;e.v='#000000';e.onclick=_=>{p=e;c.value=e.v;c.click()};e.oncontextmenu=_=>(s(e,'#000000'),!1)}
c.onchange=_=>s(p,c.value)</script>
